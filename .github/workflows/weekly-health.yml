name: Weekly project health

on:
  schedule:
    # 09:00 Asia/Kolkata every Monday (GitHub Actions schedules use UTC).
    - cron: "30 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest --cov=dns_sentinel --cov-report=term-missing
      - run: ruff check .
      - run: mypy
      - run: python -m build
      - name: Report external contributors
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/community_metrics.py
