name: Feature request
description: Propose a focused, standards-backed improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and users affected
    validations:
      required: true
  - type: input
    id: evidence
    attributes:
      label: Relevant RFC or documentation
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Expected behavior and test cases
    validations:
      required: true
